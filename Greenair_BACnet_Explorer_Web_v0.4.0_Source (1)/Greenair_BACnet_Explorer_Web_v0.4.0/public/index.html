<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greenair BACnet Explorer Web</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#18212b;--muted:#66717e;--line:#dde3ea;--green:#159447;--red:#c8392b;--nav:#16212b;--blue:#1976d2}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{height:64px;background:var(--nav);color:#fff;display:flex;align-items:center;padding:0 22px;gap:14px}header .brand{font-size:21px;font-weight:700}header .ver{opacity:.65;font-size:13px}main{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 64px)}aside{background:#1e2a36;color:#d9e1e8;padding:18px}.navbtn{display:block;width:100%;border:0;text-align:left;background:transparent;color:inherit;padding:12px 14px;border-radius:8px;margin:3px 0;font-size:15px;cursor:pointer}.navbtn:hover,.navbtn.active{background:#2d3d4d}.transport{margin-top:28px;padding:12px;border:1px solid #3b4b5a;border-radius:8px;font-size:12px;line-height:1.5}.content{padding:24px;max-width:1300px;width:100%}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:10px 15px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}.btn.secondary{background:#eef2f6;color:#263442;border:1px solid #d5dde6}.grid{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:16px;margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}.status{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#a2aab2}.online .dot{background:var(--green)}.offline .dot{background:var(--red)}.meta{color:var(--muted);font-size:13px;line-height:1.7}.points{width:100%;border-collapse:collapse;margin-top:12px}.points th,.points td{padding:10px;border-bottom:1px solid #edf0f3;text-align:left}.points th{font-size:12px;color:var(--muted);text-transform:uppercase}.value{font-variant-numeric:tabular-nums;font-weight:700}.error{color:var(--red);font-size:12px}.hero{background:linear-gradient(135deg,#fff,#f0f7f3)}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;color:var(--muted)}.log{font-family:Consolas,monospace;background:#111923;color:#dce8f5;border-radius:8px;padding:12px;white-space:pre-wrap;min-height:90px;font-size:12px;margin-top:12px}@media(max-width:800px){main{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr}.content{padding:14px}}
</style>
</head>
<body>
<header><div class="brand">Greenair BACnet Explorer Web</div><div class="ver">v0.4.0 · Render / Modbus TCP</div></header>
<main>
<aside>
<button class="navbtn active" data-view="overview">Overview</button>
<button class="navbtn" data-view="planks">Planks Inputs</button>
<button class="navbtn" data-view="tbeams">T-Beams Inputs</button>
<button class="navbtn" data-view="raw">Raw Register Reader</button>
<button class="navbtn" data-view="programs">Programs</button>
<div class="transport"><b>Transport</b><br>Bianco controllers via proven Modbus TCP path.<br><br>Planks: 502 / Unit 69<br>T-Beams: 505 / Unit 68</div>
</aside>
<section class="content" id="app"></section>
</main>
<script>
const app=document.getElementById('app'); let timer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url){const r=await fetch(url,{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}
function statusBadge(online){return `<span class="status ${online?'online':'offline'}"><span class="dot"></span>${online?'ONLINE':'OFFLINE'}</span>`}
async function overview(){clearInterval(timer);app.innerHTML=`<div class="card hero"><h1>Bianco Controller Explorer</h1><p>This build runs on Render and uses the same raw Modbus TCP route as the working Greenair TrendLog.</p><div class="toolbar" style="margin-top:16px"><button class="btn" id="connect">Connect Bianco Controllers</button><button class="btn secondary" id="refresh">Refresh</button></div><div id="result" class="log">Ready.</div></div><div class="grid" id="cards"></div>`;document.getElementById('connect').onclick=connect;document.getElementById('refresh').onclick=connect;await connect()}
async function connect(){const out=document.getElementById('result'), cards=document.getElementById('cards');out.textContent='Testing Planks and T-Beams from the Render server...';try{const d=await api('/api/connect');out.textContent=JSON.stringify(d,null,2);cards.innerHTML=d.results.map(r=>`<div class="card"><h3>${esc(r.name)}</h3>${statusBadge(r.online)}<div class="meta" style="margin-top:10px">${esc(r.host)}:${r.port}<br>Unit ID ${r.unitId}<br>${r.online?`Sample: ${esc(r.sample.name)} = ${Number(r.sample.value).toFixed(3)} ${esc(r.sample.units)}`:`${esc(r.error)}`}</div></div>`).join('')}catch(e){out.textContent='ERROR: '+e.message;cards.innerHTML=''}}
async function systemView(id){clearInterval(timer);const title=id==='planks'?'Planks Inputs':'T-Beams Inputs';app.innerHTML=`<div class="toolbar"><h2 style="margin-right:auto">${title}</h2><button class="btn secondary" id="reload">Refresh</button></div><div id="sys"></div>`;document.getElementById('reload').onclick=()=>loadSystem(id);await loadSystem(id);timer=setInterval(()=>loadSystem(id),3000)}
async function loadSystem(id){const el=document.getElementById('sys');if(!el)return;try{const d=await api('/api/system/'+id);el.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:15px"><div><h3 style="margin-top:0">${esc(d.name)}</h3><div class="meta">${esc(d.host)}:${d.port} · Unit ${d.unitId}<br>Read ${d.okCount}/${d.pointCount} points in ${d.elapsedMs} ms</div></div>${statusBadge(d.online)}</div><table class="points"><thead><tr><th>Point</th><th>Registers</th><th>Value</th><th>Status</th></tr></thead><tbody>${d.points.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.highRegister}/${p.register}</td><td class="value">${p.ok?Number(p.value).toFixed(3)+' '+esc(p.units):'—'}</td><td>${p.ok?'OK':`<span class="error">${esc(p.error)}</span>`}</td></tr>`).join('')}</tbody></table></div>`}catch(e){el.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
function rawView(){clearInterval(timer);app.innerHTML=`<div class="card"><h2>Raw Register Reader</h2><p class="meta">Read holding registers directly through the Render server. Read-only in v0.4.0.</p><div class="toolbar"><select id="system"><option value="planks">Planks</option><option value="tbeams">T-Beams</option></select><input id="reg" type="number" value="7484" min="0" max="65535" style="padding:9px"><input id="qty" type="number" value="2" min="1" max="64" style="padding:9px;width:90px"><button class="btn" id="read">Read</button></div><div class="log" id="rawout">Ready.</div></div>`;document.getElementById('read').onclick=async()=>{const s=document.getElementById('system').value,r=document.getElementById('reg').value,q=document.getElementById('qty').value,o=document.getElementById('rawout');o.textContent='Reading...';try{o.textContent=JSON.stringify(await api(`/api/raw/${s}?register=${encodeURIComponent(r)}&quantity=${encodeURIComponent(q)}`),null,2)}catch(e){o.textContent='ERROR: '+e.message}}}
function programsView(){clearInterval(timer);app.innerHTML=`<div class="card"><h2>Programs</h2><p class="meta">Program decoding/editing is deliberately parked until the Render connection is verified against both controllers. Once live data is confirmed, this page becomes the Bravo program reader/editor using the proven transport.</p></div>`}
const views={overview,planks:()=>systemView('planks'),tbeams:()=>systemView('tbeams'),raw:rawView,programs:programsView};
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');views[b.dataset.view]()});overview();
</script>
</body></html>
