<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greenair Register Diagnostics v0.7.6</title><style>body{font:16px system-ui;background:#101e29;color:#ecf5f7;max-width:1000px;margin:auto;padding:24px}input,select,button{font:inherit;padding:10px;margin:5px;border-radius:7px}button{background:#4ccf9b;border:0;cursor:pointer}pre{white-space:pre-wrap;background:#172c39;padding:18px;border-radius:10px;overflow:auto}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #39505a;padding:8px;text-align:left}.hint{color:#aec5cc}</style><h1>Greenair Register Diagnostics <small>v0.7.6</small></h1><p class="hint">Read-only. Uses the existing /api/raw endpoint. Does not change the controller or production application.</p><label>Controller <select id="sys"><option value="planks">Planks (Unit 69)</option><option value="tbeams">T-Beams (Unit 68)</option></select></label><label>Register <input id="reg" type="number" value="8093" min="0" max="65535"></label><label>Quantity <input id="qty" type="number" value="4" min="1" max="125"></label><button id="read">Read registers</button><p id="status"></p><div id="result"></div><pre id="raw">Ready.</pre><script>const $=id=>document.getElementById(id);function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function signed32(a,b){return ((a<<16)|b)|0}function view32(a,b){let v=signed32(a,b);return [v,(v/10).toFixed(3),(v/100).toFixed(3),(v/1000).toFixed(3)]}function render(d){const words=d.registers||d.values||d.data||[];if(!Array.isArray(words)){$('result').textContent='Response format unknown; inspect JSON below.';return}let html='<table><tr><th>Address</th><th>Unsigned 16-bit</th><th>Signed 16-bit</th><th>Hex</th></tr>';for(let i=0;i<words.length;i++){let v=Number(words[i]);html+='<tr><td>'+ (Number($('reg').value)+i)+'</td><td>'+v+'</td><td>'+(v>32767?v-65536:v)+'</td><td>0x'+v.toString(16).toUpperCase().padStart(4,'0')+'</td></tr>'}html+='</table>';if(words.length>=2){let a=Number(words[0]),b=Number(words[1]);html+='<h2>First two words</h2><table><tr><th>Word order</th><th>Signed 32-bit</th><th>÷10</th><th>÷100</th><th>÷1000</th></tr>';for(const [label,x,y] of [['High/Low',a,b],['Low/High',b,a]])html+='<tr><td>'+label+'</td>'+view32(x,y).map(v=>'<td>'+v+'</td>').join('')+'</tr>';html+='</table>'}$('result').innerHTML=html} $('read').onclick=async()=>{const r=Number($('reg').value),q=Number($('qty').value);if(!Number.isInteger(r)||r<0||r>65535||!Number.isInteger(q)||q<1||q>125){$('status').textContent='Invalid register or quantity';return}$('status').textContent='Reading…';try{const res=await fetch('/api/raw/'+encodeURIComponent($('sys').value)+'?register='+r+'&quantity='+q,{cache:'no-store'});const d=await res.json();$('raw').textContent=JSON.stringify(d,null,2);if(!res.ok)throw Error(d.error||'HTTP '+res.status);render(d);$('status').textContent='Read complete'}catch(e){$('status').textContent='Read failed: '+e.message;$('result').innerHTML=''}};</script></html>
